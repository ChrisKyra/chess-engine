# Builds Chess-Windows.zip: the GUI (self-contained, so no .NET install is needed)
# with Bitboard Engine 13 next to it as engine.exe, ready to send to anyone on
# 64-bit Windows.
#
#   Actions tab -> "Windows build" -> Run workflow   the zip appears under the run's Artifacts
#   git tag v13.0 && git push origin v13.0           also attaches it to a GitHub release
#
# The engine is built with GCC (MinGW-w64) for x86-64-v2, which runs on any Intel
# or AMD processor from about 2010 on, and linked statically so it needs no DLLs.
# Its perft suite and benchmark run on Windows before anything is packaged.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make
          pacboy: gcc:p

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test the engine
        shell: msys2 {0}
        run: |
          make -C Engine_13 BIN=engine.exe NATIVE=-march=x86-64-v2 LDFLAGS="-flto -pthread -static"
          ./Engine_13/engine.exe test
          ./Engine_13/engine.exe bench
          printf 'uci\nisready\nposition startpos\ngo movetime 1000\n' | ./Engine_13/engine.exe | grep -E '^(id name|readyok|bestmove)'

      - name: Publish the GUI
        shell: pwsh
        run: >
          dotnet publish gui/src/ChessGui/ChessGui.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/Chess

      - name: Assemble the zip
        shell: pwsh
        run: |
          Copy-Item Engine_13/engine.exe dist/Chess/engine.exe
          Copy-Item gui/windows-readme.txt dist/Chess/README.txt
          Get-ChildItem dist/Chess -Filter *.pdb | Remove-Item
          Get-ChildItem dist/Chess | Format-Table Name, Length
          Compress-Archive -Path dist/Chess -DestinationPath Chess-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Windows
          path: Chess-Windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Chess-Windows.zip
